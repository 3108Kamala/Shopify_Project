plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'ru.sbtqa', name: 'webdrivermanager', version: '2.4.0'
    implementation group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '4.27.0'
}

test {
    useJUnitPlatform()
}